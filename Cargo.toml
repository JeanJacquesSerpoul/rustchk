[package]
name = "rustchk-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JeanJacquesSerpoul/rustchk"
readme = "README.md"
publish = false
description = "Interface Leptos de RustChk"

[workspace]
members = ["core", "src-tauri"]

[dependencies]
rustchk-core = { path = "core" }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "Navigator", "Storage"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
