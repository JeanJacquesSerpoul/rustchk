[package]
name = "rustchk"
version = "0.1.0"
description = "Vérificateur de checksum de fichiers"
edition = "2021"
license = "MIT"
repository = "https://github.com/JeanJacquesSerpoul/rustchk"
readme = "../README.md"
publish = false

[lib]
name = "rustchk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustchk-core = { path = "../core" }
hex = "0.4.3"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pgp = "0.21.0"
tauri-plugin-window-state = "2"
ureq = { version = "3.5.0", features = ["json"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }
winreg = "0.56.0"
