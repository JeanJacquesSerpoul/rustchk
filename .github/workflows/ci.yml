name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Compile, vérifie (clippy + tests) et empaquette l'application sur chaque système.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # key_storage : protection des clés d'API attendue par les tests (voir src-tauri/src/secret.rs).
          - name: Linux
            os: ubuntu-22.04
            artifact: release/*
            key_storage: SecretService
          - name: macOS
            os: macos-latest
            artifact: target/release/bundle/macos/*.app
            key_storage: Keychain
          - name: Windows
            os: windows-latest
            artifact: release/*
            key_storage: Dpapi
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev patchelf gnome-keyring

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Installer la CLI Tauri
        run: npm install --global @tauri-apps/cli@2

      # Le backend embarque `dist/` à la compilation : l'interface doit être construite avant clippy et les tests.
      - name: Construire l'interface (Leptos)
        run: trunk build --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Les tests échouent si les clés d'API ne passent pas par la protection attendue (repli en clair).
      - name: Tests
        if: runner.os != 'Linux'
        env:
          RUSTCHK_EXPECT_KEY_STORAGE: ${{ matrix.key_storage }}
        run: cargo test --workspace

      # Dans une session D-Bus avec gnome-keyring déverrouillé : les clés d'API passent par le vrai trousseau
      # Secret Service, et non par le repli en clair d'une machine sans session graphique.
      - name: Tests (Linux, trousseau Secret Service)
        if: runner.os == 'Linux'
        env:
          RUSTCHK_EXPECT_KEY_STORAGE: ${{ matrix.key_storage }}
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --workspace'

      # Linux et Windows passent par les scripts de `scripts/` : ils sont ainsi testés à chaque changement.
      - name: Empaqueter l'AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-appimage.sh --out release

      - name: Empaqueter l'installeur NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -OutDir release

      - name: Empaqueter l'application (macOS)
        if: runner.os == 'macOS'
        run: tauri build --bundles app

      - name: Archiver le paquet
        uses: actions/upload-artifact@v7
        with:
          name: rustchk-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
