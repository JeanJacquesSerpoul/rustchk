name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Compile, vérifie (clippy + tests) et empaquette l'application sur chaque système.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb
            artifact: target/release/bundle/deb/*.deb
          - name: macOS
            os: macos-latest
            bundles: app
            artifact: target/release/bundle/macos/*.app
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Installer la CLI Tauri
        run: npm install --global @tauri-apps/cli@2

      # Le backend embarque `dist/` à la compilation : l'interface doit être construite avant clippy et les tests.
      - name: Construire l'interface (Leptos)
        run: trunk build --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Empaqueter (${{ matrix.bundles }})
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: Archiver le paquet
        uses: actions/upload-artifact@v7
        with:
          name: rustchk-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
